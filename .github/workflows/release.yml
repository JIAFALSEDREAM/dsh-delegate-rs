name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable tag to validate (vMAJOR.MINOR.PATCH)'
        required: true
        type: string
      publish:
        description: 'Publish artifacts after separately approving the release'
        type: boolean
        default: false

permissions:
  contents: read

env:
  RUST_BACKTRACE: '1'
  RELEASE_TAG: ${{ inputs.tag }}

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Prepare versions from tag
        run: python scripts/release.py prepare --tag "$RELEASE_TAG"
      - name: Validate tag, versions and main branch
        id: tag
        env:
          MAIN_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git fetch origin "$MAIN_BRANCH:refs/remotes/origin/$MAIN_BRANCH"
          python scripts/release.py validate --tag "$RELEASE_TAG" --main-ref "origin/$MAIN_BRANCH" --repository "$REPOSITORY"
      - name: Test release tooling
        run: |
          python -m unittest discover -s scripts -p 'test_*.py' -v
          node --test scripts/test-*.cjs
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.88.0'
      - name: Verify crate packaging and minimum Rust version
        run: cargo package --locked --allow-dirty

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - name: Prepare versions from tag
        run: python scripts/release.py prepare --tag "$RELEASE_TAG"
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.88.0'
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-${{ matrix.target }}-rust1.88-${{ hashFiles('Cargo.lock') }}
      - name: Install Linux build and sandbox dependencies
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo 'CC=musl-gcc' >> "$GITHUB_ENV"
          linker="CARGO_TARGET_${TARGET^^}_LINKER"
          echo "${linker//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - name: Install Codex CLI
        run: npm install -g @openai/codex@0.166.0
      - name: Install dsh for real headless/PTC doctor probes
        if: runner.os == 'Linux'
        run: npm install -g @deepseek-ai/dsh@0.2.2-rc.1
      - name: Check and test
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --target "$TARGET" -- -D warnings
          cargo test --locked --target "$TARGET"
          if [[ "$RUNNER_OS" == macOS ]]; then
            for attempt in {1..5}; do
              cargo test --locked --target "$TARGET" --test runtime concurrent_synchronous_results_survive_automatic_retention
            done
          fi
          cargo test --locked --target "$TARGET" --test sandbox native_sandbox_preserves_fixture -- --ignored
          if [[ "$RUNNER_OS" == Linux ]]; then
            cargo run --locked --target "$TARGET" -- --state-dir "$RUNNER_TEMP/dsh-doctor-state" doctor
          fi
      - name: Build and smoke test native binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo build --locked --release --target "$TARGET"
          binary="target/$TARGET/release/dsh-delegate-rs"
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          "$binary" --version
          "$binary" --help
      - name: Package native binary
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: python scripts/release.py archive --target "$TARGET" --version "$VERSION" --output "dist/$TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.target }}/
          if-no-files-found: error

  github:
    if: inputs.publish
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare versions from tag
        run: python scripts/release.py prepare --tag "$RELEASE_TAG"
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Assemble npm package and checksums
        env:
          REPOSITORY: ${{ github.repository }}
        run: python scripts/release.py assemble --artifacts artifacts --output dist --repository "$REPOSITORY"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > /tmp/release-draft; then
            if [[ "$(cat /tmp/release-draft)" == false ]]; then
              gh release download "$RELEASE_TAG" --dir dist/published
              python scripts/release.py reuse-assets --published dist/published --output dist/assets
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG" --draft
          fi
          gh release upload "$RELEASE_TAG" dist/assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: dist/assets/*.tgz
          if-no-files-found: error

  npm:
    if: inputs.publish
    needs: [validate, github]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare versions from tag
        run: python scripts/release.py prepare --tag "$RELEASE_TAG"
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - run: npm install -g npm@11
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: dist
      - name: Publish npm using trusted publishing
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          for package in $(node -p 'Object.keys(require("./npm/package.json").optionalDependencies).join(" ")'); do
            node scripts/publish-npm.mjs "dist/$package-$VERSION.tgz" "$VERSION" "$package"
          done
          node scripts/publish-npm.mjs "dist/dsh-delegate-rs-$VERSION.tgz" "$VERSION"

  crates:
    if: inputs.publish
    needs: [validate, github]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare versions from tag
        run: python scripts/release.py prepare --tag "$RELEASE_TAG"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.88.0'
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || { echo 'Configure the CARGO_REGISTRY_TOKEN repository secret'; exit 1; }
          python scripts/publish-crate.py
